spring:
  config:
    import: "optional:configserver:http://localhost:8888"
  application:
    name: hotels-service

  # Configuracion de la base de datos
  datasource:
    url: jdbc:postgresql://localhost:5432/hotels_db?createDatabaseIfNotExist=true
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  # Configuracion de Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      data-locations: classpath:import-hotels.sql
      mode: always

  web:
    resources:
      static-locations: classpath:/,classpath:/static/

# Configuracion OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    url: /api/openapi.yaml

reviews:
  service:
    url: ${REVIEWS_SERVICE_URL:http://localhost:8081}

resilience4j:
  circuitbreaker:
    instances:
      reviewsService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2