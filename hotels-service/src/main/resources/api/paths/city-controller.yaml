cities:
  post:
    tags:
      - Ciudades
    summary: Crear una ciudad
    description: Registra una nueva ciudad en la base de datos
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/city-schemas.yaml#/CityRequestDto'
    responses:
      '201':
        description: Ciudad creada con éxito
        content:
          application/json:
            schema:
              $ref: '../components/city-schemas.yaml#/CityResponseDto'
      '400':
        description: Datos de entrada no válidos

  get:
    tags:
      - Ciudades
    summary: Obtener todas las ciudades
    description: Devuelve una lista con todas las ciudades registradas
    responses:
      '200':
        description: Lista de ciudades obtenida con éxito
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/city-schemas.yaml#/CityResponseDto'

cityById:
  get:
    tags:
      - Ciudades
    summary: Obtener ciudad por ID
    description: Busca los detalles de una ciudad por su ID
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la ciudad
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Ciudad encontrada
        content:
          application/json:
            schema:
              $ref: '../components/city-schemas.yaml#/CityResponseDto'
      '404':
        description: Ciudad no encontrada

  put:
    tags:
      - Ciudades
    summary: Actualizar una ciudad
    description: Actualiza los datos de una ciudad existente
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la ciudad
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/city-schemas.yaml#/CityRequestDto'
    responses:
      '200':
        description: Ciudad actualizada correctamente
        content:
          application/json:
            schema:
              $ref: '../components/city-schemas.yaml#/CityResponseDto'
      '400':
        description: Datos de petición no válidos
      '404':
        description: Ciudad no encontrada

  delete:
    tags:
      - Ciudades
    summary: Eliminar una ciudad
    description: Elimina una ciudad del sistema a partir de su ID
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la ciudad
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Ciudad eliminada correctamente
      '404':
        description: Ciudad no encontrada