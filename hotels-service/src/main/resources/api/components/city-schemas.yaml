CityRequestDto:
  type: object
  title: CityRequestDto
  description: DTO para crear o actualizar una ciudad
  properties:
    name:
      type: string
      description: Nombre de la ciudad
      example: Madrid
    country:
      type: string
      description: País de la ciudad
      example: España
  required:
    - name
    - country

CityResponseDto:
  type: object
  title: CityResponseDto
  description: DTO para la respuesta de una ciudad
  properties:
    id:
      type: integer
      format: int64
      description: ID único de la ciudad
      example: 1
    name:
      type: string
      description: Nombre de la ciudad
      example: Madrid
    country:
      type: string
      description: País de la ciudad
      example: España
  required:
    - id
    - name
    - country

CityPageResponseDto:
  type: object
  title: CityPageResponseDto
  description: Página de resultados de ciudades
  properties:
    content:
      type: array
      items:
        $ref: '#/CityResponseDto'
    totalElements:
      type: integer
      format: int64
      example: 42
    totalPages:
      type: integer
      example: 5
    number:
      type: integer
      description: Número de página actual (0-indexado)
      example: 0
    size:
      type: integer
      description: Tamaño de página solicitado
      example: 10
    first:
      type: boolean
      example: true
    last:
      type: boolean
      example: false
    empty:
      type: boolean
      example: false