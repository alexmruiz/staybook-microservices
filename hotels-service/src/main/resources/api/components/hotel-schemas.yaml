HotelRequestDto:
  type: object
  title: HotelRequestDto
  description: DTO para crear o actualizar un hotel
  properties:
    name:
      type: string
      description: Nombre del hotel
      example: Grand Hotel Central
    description:
      type: string
      description: Descripción del hotel
      example: Hotel céntrico y moderno
    address:
      $ref: './hotel-schemas.yaml#/AddressRequestDto'
    stars:
      type: integer
      format: int32
      minimum: 1
      description: Categoría del hotel en estrellas
      example: 4
    capacity:
      type: integer
      format: int32
      minimum: 1
      description: Capacidad total del hotel
      example: 100
    roomTypes:
      type: array
      items:
        $ref: './hotel-schemas.yaml#/RoomTypeRequestDto'
    amenitiesIds:
      type: array
      items:
        type: integer
        format: int64
  required:
    - name
    - address
    - roomTypes

HotelResponseDto:
  type: object
  title: HotelResponseDto
  description: DTO para la respuesta de un hotel
  properties:
    id:
      type: integer
      format: int64
      description: ID único del hotel
      example: 1
    name:
      type: string
      description: Nombre del hotel
      example: Grand Hotel Central
    description:
      type: string
    stars:
      type: integer
      format: int32
    capacity:
      type: integer
      format: int32
    roomTypes:
      type: array
      items:
        $ref: './hotel-schemas.yaml#/RoomTypeResponseDto'
    services:
      type: array
      items:
        $ref: './hotel-schemas.yaml#/AmenityResponseDto'
  required:
    - id
    - name

AddressRequestDto:
  type: object
  properties:
    street:
      type: string
    streetNumber:
      type: string
    postalCode:
      type: string
    city:
      $ref: './city-schemas.yaml#/CityRequestDto'
  required:
    - street
    - streetNumber
    - postalCode
    - city

RoomTypeRequestDto:
  type: object
  properties:
    type:
      type: string
      enum: [SINGLE, DOUBLE, TWIN, SUITE, FAMILY]
    quantity:
      type: integer
      format: int32
  required:
    - type
    - quantity

RoomTypeResponseDto:
  allOf:
    - $ref: './hotel-schemas.yaml#/RoomTypeRequestDto'
    - type: object
      properties:
        id:
          type: integer
          format: int64

AmenityResponseDto:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    description:
      type: string
  required:
    - id
    - name