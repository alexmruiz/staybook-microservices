AmenityRequestDto:
  type: object
  title: AmenityRequestDto
  description: DTO para crear o actualizar un servicio del hotel
  properties:
    name:
      type: string
      description: Nombre del servicio
      example: WiFi gratuito
    description:
      type: string
      description: Descripción del servicio
      example: Conexión WiFi disponible en todo el hotel
  required:
    - name

AmenityResponseDto:
  type: object
  title: AmenityResponseDto
  description: DTO de respuesta de un servicio del hotel
  properties:
    id:
      type: integer
      format: int64
      description: ID único del servicio
      example: 1
    name:
      type: string
      description: Nombre del servicio
      example: WiFi gratuito
    description:
      type: string
      description: Descripción del servicio
      example: Conexión WiFi disponible en todo el hotel
  required:
    - id
    - name
