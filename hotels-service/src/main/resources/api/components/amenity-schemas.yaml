AmenityRequestDto:
  type: object
  title: AmenityRequestDto
  description: DTO para crear o actualizar un servicio del hotel
  properties:
    name:
      type: string
      description: Nombre del servicio
      example: WiFi gratuito
    description:
      type: string
      description: Descripción del servicio
      example: Conexión WiFi disponible en todo el hotel
  required:
    - name

AmenityResponseDto:
  type: object
  title: AmenityResponseDto
  description: DTO de respuesta de un servicio del hotel
  properties:
    id:
      type: integer
      format: int64
      description: ID único del servicio
      example: 1
    name:
      type: string
      description: Nombre del servicio
      example: WiFi gratuito
    description:
      type: string
      description: Descripción del servicio
      example: Conexión WiFi disponible en todo el hotel
  required:
    - id
    - name

AmenityPageResponseDto:
  type: object
  title: AmenityPageResponseDto
  description: Página de resultados de servicios
  properties:
    content:
      type: array
      items:
        $ref: '#/AmenityResponseDto'
    totalElements:
      type: integer
      format: int64
      example: 42
    totalPages:
      type: integer
      example: 5
    number:
      type: integer
      description: Número de página actual (0-indexado)
      example: 0
    size:
      type: integer
      description: Tamaño de página solicitado
      example: 10
    first:
      type: boolean
      example: true
    last:
      type: boolean
      example: false
    empty:
      type: boolean
      example: false
