openapi: 3.0.3
info:
  title: StayBook - Booking Service API
  version: 1.0.0
  description: API del servicio de reservas (booking-service). Paths y componentes organizados en archivos separados (./paths, ./components).
servers:
  - url: /
paths:
  /api/bookings:
    $ref: './paths/bookings-controller.yaml#/bookings/~1api~1bookings'
  /api/bookings/{bookingId}:
    $ref: './paths/bookings-controller.yaml#/bookingById/~1api~1bookings~1{bookingId}'
  /api/bookings/{bookingId}/details:
    $ref: './paths/bookings-controller.yaml#/bookingDetails/~1api~1bookings~1{bookingId}~1details'
  /api/bookings/{bookingId}/confirm:
    $ref: './paths/bookings-controller.yaml#/bookingConfirm/~1api~1bookings~1{bookingId}~1confirm'
  /api/bookings/{bookingId}/cancel:
    $ref: './paths/bookings-controller.yaml#/bookingCancel/~1api~1bookings~1{bookingId}~1cancel'
  /api/room-availability:
    $ref: './paths/room-availability-controller.yaml#/roomAvailability/~1api~1room-availability'

security:
  - BearerAuth: []

components:
  $ref: './components/schemas.yaml#/components'
