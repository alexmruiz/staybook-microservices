spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.secret=test-secret-for-unit-tests-only-32-chars
spring.jpa.defer-datasource-initialization=true
hotels-service.base-url=http://localhost:8080
reviews-service.base-url=http://localhost:8081

resilience4j.circuitbreaker.instances.hotelsServiceCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.hotelsServiceCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.hotelsServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.hotelsServiceCB.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.hotelsServiceCB.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.hotelsServiceCB.permitted-number-of-calls-in-half-open-state=3