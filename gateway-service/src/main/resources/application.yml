server:
  port: 8090

spring:
  config:
    import: "optional:configserver:http://localhost:8888"
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotels-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/hotels/**,/api/cities/**,/api/amenities/**

            - id: booking-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/bookings/**,/api/room-availability/**

            - id: reviews-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/reviews/**

            - id: auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/auth/**,/api/users/**
