server:
  port: 8090

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hotels-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/hotels/**,/api/cities/**,/api/amenities/**

            - id: booking-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/bookings/**,/api/room-availability/**

            - id: reviews-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/reviews/**

            - id: auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/auth/**,/api/users/**

jwt:
  secret: ${JWT_SECRET:dev-only-secret-CHANGE-ME-not-for-real-use-32chars}
