register:
  post:
    tags:
      - Autenticación
    summary: Registrar nuevo usuario
    description: Crea una cuenta sin verificar y provoca el envío asíncrono de un correo de verificación. El inicio de sesión requiere completar la verificación.
    operationId: register
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/auth-schemas.yaml#/RegisterRequestDto'
    responses:
      '201':
        description: Usuario registrado; el correo de verificación se procesa de forma asíncrona
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/UserResponseDto'
      '400':
        description: Datos de entrada inválidos
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'
      '409':
        description: El email ya está registrado
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'

login:
  post:
    tags:
      - Autenticación
    summary: Autenticar usuario y obtener token JWT
    operationId: login
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/auth-schemas.yaml#/LoginRequestDto'
    responses:
      '200':
        description: Autenticación exitosa
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/AuthResponseDto'
      '400':
        description: Credenciales inválidas o datos incompletos
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'
      '401':
        description: Email o contraseña incorrectos, o cuenta aún no verificada
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'

verifyEmail:
  post:
    tags:
      - Autenticación
    summary: Verificar el correo electrónico
    description: Verifica la cuenta usando el token de un solo uso recibido por correo. El token caduca a los 30 minutos.
    operationId: verifyEmail
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/auth-schemas.yaml#/VerifyEmailRequest'
    responses:
      '200':
        description: Correo electrónico verificado correctamente
      '400':
        description: El campo token falta o está vacío
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'
      '401':
        description: Código de verificación inexistente, caducado o ya utilizado
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'
