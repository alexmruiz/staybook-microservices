userProfile:
  get:
    tags:
      - Usuarios
    summary: Obtener perfil del usuario autenticado
    operationId: getMyProfile
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Perfil del usuario obtenido exitosamente
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/UserResponseDto'
      '401':
        description: Usuario no autenticado
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'

  put:
    tags:
      - Usuarios
    summary: Actualizar perfil del usuario autenticado
    operationId: updateMyProfile
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/auth-schemas.yaml#/RegisterRequestDto'
    responses:
      '200':
        description: Perfil actualizado exitosamente
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/UserResponseDto'
      '400':
        description: Datos de entrada inválidos
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'
      '401':
        description: Usuario no autenticado
        content:
          application/json:
            schema:
              $ref: '../components/auth-schemas.yaml#/ErrorResponse'
