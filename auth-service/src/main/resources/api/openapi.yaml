openapi: 3.0.0
info:
  title: Auth Service API
  version: 1.0.0
  description: API para autenticación, registro y gestión de perfiles de usuario

servers:
  - url: http://localhost:8083
    description: Servidor local

tags:
  - name: Autenticación
    description: Endpoints para registro e inicio de sesión
  - name: Usuarios
    description: Endpoints para gestión de perfiles de usuario

paths:
  /api/auth/register:
    $ref: './paths/auth-controller.yaml#/register'
  /api/auth/login:
    $ref: './paths/auth-controller.yaml#/login'
  /api/users/me:
    $ref: './paths/user-controller.yaml#/userProfile'

components:
  $ref: './schemas/schemas.yaml#/components'
