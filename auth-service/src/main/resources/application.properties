spring.application.name=auth-service

# Configuración de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

#Configuración de Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Estrategia de nombres
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Clave secreta para firmar los JWT (mínimo 256 bits para HS256)
# RECOMENDADO: definir siempre la variable de entorno JWT_SECRET en el entorno
# de despliegue. No incluir valores secretos en ficheros versionados.
# Para forzar que el arranque falle si no está definida (más seguro), no
# incluimos un valor por defecto aquí — Spring fallará al resolver la prop.
jwt.secret=${JWT_SECRET}
# Tiempo de expiración del token en milisegundos (ejemplo: 24 horas = 86400000 ms)
jwt.expiration=86400000

server.port=8083

#spring.sql.init.mode=always

# Configuración OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.groups.enabled=true
springdoc.swagger-ui.url=/api/openapi.yaml
spring.web.resources.static-locations=classpath:/,classpath:/static/
