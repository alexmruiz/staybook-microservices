spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/reviews_db?useSSL=false&serverTimezone=UTC"
    # url: "jdbc:mysql://host.docker.internal:3306/db_hotelsbook"
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  # Configuracion de Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  #sql:
    #init:
      #mode: always

  web:
    resources:
      static-locations: classpath:/,classpath:/static/

# Configuracion OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    url: /api/openapi.yaml