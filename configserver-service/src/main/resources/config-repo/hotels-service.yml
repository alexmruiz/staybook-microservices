spring:
  cloud:
    openfeign:
      client:
        config:
          reviews-service:
            connectTimeout: 2000
            readTimeout: 5000

  datasource:
    url: jdbc:postgresql://localhost:5432/hotels_db?createDatabaseIfNotExist=true
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    defer-datasource-initialization: true

  #sql:
    #init:
      #mode: always

  web:
    resources:
      static-locations: classpath:/,classpath:/static/

springdoc:
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    url: /api/openapi.yaml

reviews:
  service:
    url: ${REVIEWS_SERVICE_URL:http://localhost:8081}

resilience4j:
  circuitbreaker:
    instances:
      reviewsService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2

countries-now:
  base-url: https://countriesnow.space/api/v0.1