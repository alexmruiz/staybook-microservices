spring.application.name=notifications

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notifications_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:notifications}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:notifications-dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

server.port=8084

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:staybook}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:staybook-dev}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Tiempos en milisegundos
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

notifications.mail.from=no-reply@staybook.com
notifications.mail.default-recipient=usuario@example.com